name: Build ElysiumAdventure

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ElysiumAdventure
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Install ElysiumCore
        run: |
          git clone https://github.com/${{ github.repository_owner }}/ElysiumCore.git
          cd ElysiumCore
          mvn install -B --no-transfer-progress -DskipTests
          cd ..

      - name: Build ElysiumAdventure
        run: mvn clean package -B --no-transfer-progress

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ElysiumAdventure
          path: target/ElysiumAdventure-*.jar
          
