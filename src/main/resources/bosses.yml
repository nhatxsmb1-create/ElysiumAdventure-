# Dinh nghia Boss
# mythicmob-id: ten mob trong MythicMobs (chi dung de spawn)
# ElysiumAdventure tu quan ly toan bo phase, skill, reward

bosses:
  DRAGON_LORD:
    display-name: "&4&l🐉 Rồng Chúa"
    mythicmob-id: "ElysiumDragon"      # Ten mob trong MythicMobs
    max-hp: 5000
    phases:
      - threshold: 100   # 100% HP -> Phase 1
        name: "Binh Thuong"
        skills: [FIRE_BREATH, WING_SLAM]
        speed: 0.3
      - threshold: 60    # 60% HP -> Phase 2
        name: "Cuong No"
        skills: [FIRE_BREATH, WING_SLAM, SUMMON_MINION]
        speed: 0.5
        announce: "&c&l☠ Rồng Chúa vào giai đoạn CUỒNG NỘ!"
      - threshold: 30    # 30% HP -> Phase 3
        name: "Tan Diet"
        skills: [FIRE_BREATH, METEOR_RAIN, SUMMON_MINION]
        speed: 0.7
        announce: "&4&l💀 Rồng Chúa sắp TAN DIỆT — hãy cẩn thận!"
    rewards:
      exp: 5000
      money: 10000
      commands:
        - "give %player% diamond 5"

  FROST_KING:
    display-name: "&b&l❄ Băng Vương"
    mythicmob-id: "ElysiumFrostKing"
    max-hp: 3000
    phases:
      - threshold: 100
        name: "Lanh Gia"
        skills: [ICE_SPIKE, FREEZE_AURA]
        speed: 0.25
      - threshold: 50
        name: "Bao Tuyet"
        skills: [ICE_SPIKE, FREEZE_AURA, BLIZZARD]
        speed: 0.4
        announce: "&b&l❄ Băng Vương triệu hồi BÃO TUYẾT!"
    rewards:
      exp: 3000
      money: 6000
      commands: []

# Dinh nghia Skill Boss
skills:
  FIRE_BREATH:
    name: "Hơi Thở Lửa"
    type: CONE_DAMAGE        # CONE_DAMAGE | AOE_DAMAGE | PROJECTILE | SUMMON | DEBUFF | METEOR
    damage: 15.0
    range: 8.0
    angle: 60.0
    cooldown: 5
    particle: FLAME

  WING_SLAM:
    name: "Đập Cánh"
    type: AOE_DAMAGE
    damage: 20.0
    range: 5.0
    cooldown: 8
    knockback: 3.0
    particle: EXPLOSION_NORMAL

  SUMMON_MINION:
    name: "Triệu Hồi Minion"
    type: SUMMON
    mythicmob-id: "DragonMinion"
    count: 3
    cooldown: 20

  METEOR_RAIN:
    name: "Mưa Thiên Thạch"
    type: METEOR
    damage: 25.0
    count: 5
    radius: 10.0
    cooldown: 15
    particle: LAVA

  ICE_SPIKE:
    name: "Gai Băng"
    type: PROJECTILE
    damage: 12.0
    cooldown: 4
    particle: SNOWFLAKE
    slow-duration: 40
    slow-amplifier: 1

  FREEZE_AURA:
    name: "Hào Quang Băng"
    type: DEBUFF
    range: 6.0
    cooldown: 12
    potion: SLOWNESS
    amplifier: 2
    duration: 60

  BLIZZARD:
    name: "Bão Tuyết"
    type: AOE_DAMAGE
    damage: 10.0
    range: 12.0
    cooldown: 25
    particle: SNOWFLAKE
